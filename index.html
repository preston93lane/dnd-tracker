<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DM Screen</title>
<style>
:root{--bg:#14161b;--p:#1d2128;--p2:#262b34;--line:#38404d;--tx:#e9e3d3;--mu:#9a9686;--br:#c9a24b;--red:#c2503f;--grn:#7aa35f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,sans-serif;display:grid;grid-template-columns:86px 1fr}
nav{background:var(--p);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:10px 6px}
nav button{display:flex;flex-direction:column;align-items:center;font-size:12px;border:0;background:none;padding:10px 2px;border-radius:8px}nav button span{font-size:22px}
nav button.on{background:var(--p2);color:var(--br)}
main{overflow:auto;padding:0 18px 20px;height:100vh}.tab{display:none}.tab.on{display:block}
button,select,input,textarea{font:inherit;color:var(--tx)}
button,.btn{background:var(--p2);border:1px solid var(--line);border-radius:6px;min-height:40px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--br);color:#1a1405;border-color:var(--br);font-weight:600}.dg{color:var(--red)}
input,select,textarea{background:#101216;border:1px solid var(--line);border-radius:6px;padding:7px;min-height:40px}
.mu,small{color:var(--mu)}.tools,.top,.bh,.fls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.top{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-top:0}
#round{color:var(--br);font-weight:700;font-size:1.3em}
.picker{position:relative}.picker input{width:340px}
#pl{position:absolute;top:100%;left:0;width:100%;max-height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--p);border:1px solid var(--line);border-radius:6px;z-index:50;box-shadow:0 10px 24px #000a}
.pi,.it{padding:9px 11px;border-bottom:1px solid var(--line);cursor:pointer}.pi small,.it small{display:block}.it.on{background:var(--p2);border-left:3px solid var(--br)}
.cb{background:var(--p);border:1px solid var(--line);border-left:5px solid var(--br);border-radius:8px;margin:10px 0;padding:10px}
.cb.monster{border-left-color:var(--red)}.cb.player{border-left-color:var(--grn)}.cb.act{box-shadow:0 0 0 2px var(--grn)}.cb.dead{opacity:.45}
.r1,.r2{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}.r2{margin-top:8px;align-items:stretch}
.r1 label{font-size:11px;color:var(--mu)}.r1 label input{display:block;width:64px}.r1 .nm{flex:1;min-width:160px;width:auto;font-size:16px}
.r1 label:has(.nm){flex:1}.calc{border-color:var(--br)!important;width:70px!important}
.bar{height:6px;background:#0c0d10;border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%}
.cons{display:flex;gap:4px;flex-wrap:wrap;max-width:260px}.cd{padding:2px 6px;min-height:36px;opacity:.4}.cd.on{opacity:1;border-color:var(--br);background:#3a3322}
.r2 textarea{flex:1;min-width:200px;min-height:40px}
.split{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;height:calc(100vh - 150px)}
.list,.det{overflow:auto;border:1px solid var(--line);border-radius:8px}.list{background:var(--p)}.det{padding:12px}
.nav2{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sb{background:#efe6cf;color:#2a2118;font-family:Georgia,serif;border:1px solid #b9a678;border-radius:3px;padding:14px 18px;max-width:640px;margin-top:8px}
.sb h3{margin:0;color:#7a1f14;font-size:1.5em}.sb .sub{font-style:italic}.sb hr{border:0;border-top:2px solid #8a2a1c;margin:8px 0}
.sb h4{color:#7a1f14;border-bottom:1px solid #8a2a1c;margin:12px 0 4px;font-size:1.15em}.sb p{margin:6px 0}
.ab{display:grid;grid-template-columns:repeat(6,1fr);text-align:center}.ab b{display:block;color:#7a1f14}.ab small{display:block;color:#2a2118}
#hbf{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}#hbf label{display:flex;flex-direction:column;font-size:12px;color:var(--mu)}#hbf .w{grid-column:1/-1}
.lt{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.mo{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:100}.mb{background:var(--p);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(460px,92vw);display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow:auto}.mb h3{margin:0}.mb label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--br);color:#1a1405;padding:8px 16px;border-radius:20px;z-index:99}
</style></head><body>
<nav><button data-t="track" class="on"><span>⚔️</span>Tracker</button><button data-t="mon"><span>🐉</span>Bestiary</button><button data-t="spell"><span>📖</span>Spells</button><button data-t="hb"><span>🧪</span>Homebrew</button><button data-t="loot"><span>💰</span>Loot</button></nav>
<main>
<section id="t-track" class="tab on">
 <div class="top"><span>Round <span id="round">1</span></span>
  <button class="pri" data-g="next">⏭ Next turn</button><button data-g="init">🎲 Init</button><button data-g="hp">🎲 HP</button><button data-g="sort">⬇ Sort</button><button data-g="md">📋 Export</button>
  <div class="picker"><input id="pq" placeholder="Search monsters…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"><div id="pl" hidden></div></div>
  <button data-g="addm">+ Monster</button><button data-g="player">+ Player</button><button data-g="party">+ Party</button><button data-g="custom">+ Custom</button><button data-g="lair">+ Lair</button>
  <select id="es"></select><button data-g="eload">Load</button><button data-g="esave">💾 Save</button><button data-g="edel" class="dg">🗑</button></div>
 <div id="list"></div></section>
<section id="t-mon" class="tab"><div class="tools"><label class="btn">📁 Import monster JSON<input type="file" accept=".json" hidden data-imp="mon"></label></div><div id="bm"></div></section>
<section id="t-spell" class="tab"><div class="tools"><label class="btn">📁 Import spell JSON<input type="file" accept=".json" hidden data-imp="spell"></label></div><div id="bs"></div></section>
<section id="t-hb" class="tab"><div class="tools"><button class="pri" data-a="hbdl">⬇ Download homebrew-monsters.json</button><button data-a="hbcp">📋 Copy entries</button><span class="mu">Copied entries paste straight into the array in all-monsters.json.</span></div>
 <div id="hbl"></div><h3>Monster editor</h3><div id="hbf"></div></section>
<section id="t-loot" class="tab"><div class="tools" id="lb"></div><div class="tools"><button class="dg" data-l="clear">Clear</button><button data-l="copy">📋 Copy for Obsidian</button></div><div id="ld"></div></section>
</main><div id="msg" hidden></div>
<script src="loot-tables.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
/* in-page dialogs: prompt()/confirm() are blocked inside published artifacts */
const fld=f=>`<label>${esc(f.label)}${f.type=='select'?`<select name="${f.k}">${f.opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>`:f.type=='area'?`<textarea name="${f.k}" rows="8">${esc(f.value)}</textarea>`:`<input name="${f.k}" type="${f.type||'text'}" value="${esc(f.value??'')}"${f.list?` list="dl-${f.k}"`:''} autocomplete="off">${f.list?`<datalist id="dl-${f.k}">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`}</label>`;
const ask=(title,fields=[],ok='OK')=>new Promise(res=>{const o=document.createElement('div');o.className='mo';o.innerHTML=`<form class="mb"><h3>${esc(title)}</h3>${fields.map(fld).join('')}<div class="tools"><button type="submit" class="pri">${esc(ok)}</button><button type="button" class="x">Cancel</button></div></form>`;document.body.appendChild(o);const fm=$('form',o),end=v=>{o.remove();res(v)};fm.onsubmit=e=>{e.preventDefault();const d={};new FormData(fm).forEach((v,k)=>d[k]=v);end(d)};$('.x',o).onclick=()=>end(null);$('input,textarea',o)?.focus()});
const copy=async(t,msg)=>{try{await navigator.clipboard.writeText(t);toast(msg)}catch{await ask('Copy this text',[{k:'t',label:'Select all, then copy',type:'area',value:t}],'Done')}};
const toast=m=>{const t=$('#msg');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3000)};
/* ---------- storage (IndexedDB: handles the 11 MB monster file) ---------- */
const DB=new Promise((ok,no)=>{const r=indexedDB.open('dmscreen',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=(m,f)=>DB.then(d=>new Promise((ok,no)=>{const q=f(d.transaction('kv',m).objectStore('kv'));q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
let stOk=true;const warn=()=>{if(stOk){stOk=false;toast('Browser storage is blocked here, so data lasts only until you close this page.')}};
const mem=new Map(),get=k=>tx('readonly',s=>s.get(k)).then(v=>v??mem.get(k),()=>mem.get(k)),set=(k,v)=>{mem.set(k,v);return tx('readwrite',s=>s.put(v,k)).catch(()=>{warn();return null})};
let S={board:[],active:-1,round:1},raw={mon:[],spell:[],hb:[]},IX={mon:[],spell:[]},BY=new Map(),svT;
const strip=b=>b.map(({statBlock,...c})=>c);
const save=()=>{clearTimeout(svT);svT=setTimeout(()=>set('board',{...S,board:strip(S.board)}).catch(()=>{}),300)};
const arr=j=>Array.isArray(j)?j:j.results||j.monsters||j.spells||j.data||[j];
const key=x=>String(x.slug||x.name).toLowerCase();
const merge=(k,list)=>{const m=new Map(raw[k].map(x=>[key(x),x]));let n=0;list.forEach(x=>{if(x&&x.name&&!m.has(key(x))){m.set(key(x),x);n++}});raw[k]=[...m.values()];return n};
/* ---------- normalising monsters & spells ---------- */
const crN=v=>{if(v==null||v==='')return -1;if(typeof v=='number')return v;const s=String(v);if(s.includes('/')){const[a,b]=s.split('/');return a/b}return parseFloat(s)||0};
const crS=n=>n<0?'?':n==.125?'1/8':n==.25?'1/4':n==.5?'1/2':String(n);
const AB=[['str','strength'],['dex','dexterity'],['con','constitution'],['int','intelligence'],['wis','wisdom'],['cha','charisma']];
const sc=(m,a,f)=>m.scores?.[a]??m[f]??10,mod=s=>{const v=Math.floor((s-10)/2);return v>=0?'+'+v:''+v};
function src(m){const d=(m.document__slug||m.document__title||'').toLowerCase(),s=(m.slug||'').toLowerCase();
 if(d=='homebrew')return'Homebrew';if(d.includes('blackflag')||s.endsWith('_bf'))return'Black Flag';if(d.includes('menagerie')||s.endsWith('a5e'))return'A5E';
 if(d.includes('2024')||d.includes('5.5'))return'5.5e';if(d.includes('tob')||d.includes('tome of beasts'))return'Kobold Press';return'5e'}
function acOf(m){const a=m.armor_class??m.ac;if(Array.isArray(a))return parseInt(typeof a[0]=='object'?a[0].value:a[0])||10;return parseInt(a)||10}
const nm=m=>({m,name:m.name||'?',L:(m.name||'').toLowerCase(),slug:String(m.slug||m.name),cr:crN(m.challenge_rating??m.cr),type:String(m.type||'').split(/[ (,]/)[0].toLowerCase(),size:m.size||'',ac:acOf(m),hp:parseInt(m.hit_points??m.hp?.average??m.hp)||0,src:src(m)});
const cap=s=>s?s[0].toUpperCase()+s.slice(1).toLowerCase():'';
const yn=v=>v===true||v==='yes';
const sn=s=>{const lv=s.level_int??(typeof s.level=='number'?s.level:parseInt(s.level)||0);return{m:s,name:s.name,L:s.name.toLowerCase(),lv,sch:cap(s.school?.name||s.school||''),cl:s.dnd_class?String(s.dnd_class).split(/,\s*/):(s.classes||[]).map(c=>c.name||c),rit:yn(s.ritual),con:yn(s.concentration)||/concentration/i.test(s.duration||'')}};
function reindex(){const m=new Map();[...raw.mon,...raw.hb].forEach(x=>m.set(key(x),x));IX.mon=[...m.values()].map(nm);BY=new Map(IX.mon.map(x=>[x.slug,x]));IX.spell=raw.spell.filter(s=>s&&s.name).map(sn)}
/* ---------- stat block / spell renderers ---------- */
const lst=v=>Array.isArray(v)?v.map(a=>typeof a=='object'?`<p><b><i>${esc(a.name)}.</i></b> ${esc(a.desc)}</p>`:`<p>${esc(a)}</p>`).join(''):v?`<p>${esc(v).replace(/\n/g,'<br>')}</p>`:'';
const sec=(t,v)=>(Array.isArray(v)?v.length:v)?`<h4>${t}</h4>${lst(v)}`:'';
const line=(t,v)=>{if(v==null||v===''||(typeof v=='object'&&!Object.keys(v).length))return'';if(typeof v=='object')v=Object.entries(v).map(([k,x])=>k+' '+x).join(', ');return`<div><b>${t}</b> ${esc(v)}</div>`};
function sb(m){const n=nm(m),sv=AB.filter(([a,f])=>m[f+'_save']!=null&&m[f+'_save']!=='').map(([a,f])=>a.toUpperCase()+' '+(m[f+'_save']>=0?'+':'')+m[f+'_save']).join(', ');
 return`<div class="sb"><h3>${esc(n.name)}</h3><div class="sub">${esc([n.size,m.type,m.subtype&&'('+m.subtype+')',m.alignment].filter(Boolean).join(' '))}</div><hr>
${line('Armor Class',m.armor_desc?n.ac+' ('+m.armor_desc+')':n.ac)}${line('Hit Points',n.hp+(m.hit_dice?' ('+m.hit_dice+')':''))}${line('Speed',m.speed)}<hr>
<div class="ab">${AB.map(([a,f])=>{const s=sc(m,a,f);return`<div><b>${a.toUpperCase()}</b>${s}<small>${mod(s)}</small></div>`}).join('')}</div><hr>
${line('Saves',sv)}${line('Skills',m.skills)}${line('Vulnerabilities',m.damage_vulnerabilities)}${line('Resistances',m.damage_resistances)}${line('Immunities',m.damage_immunities)}${line('Condition Immunities',m.condition_immunities)}${line('Senses',m.senses)}${line('Languages',m.languages)}${line('Challenge',n.cr>=0?crS(n.cr):'')}<hr>
${lst(m.special_abilities||m.traits)}${sec('Actions',m.actions)}${sec('Bonus Actions',m.bonus_actions)}${sec('Reactions',m.reactions)}${sec('Legendary Actions',m.legendary_actions)}</div>`}
const para=v=>[].concat(v||[]).join('\n').split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');
const spellCard=x=>{const m=x.m;return`<div class="sb"><h3>${esc(x.name)}</h3><div class="sub">${x.lv?x.lv+'-level ':''}${esc(x.sch)}${x.lv?'':' cantrip'}${x.rit?' (ritual)':''}</div><hr>${line('Casting Time',m.casting_time)}${line('Range',m.range)}${line('Components',[].concat(m.components||[]).join(', '))}${line('Materials',m.material)}${line('Duration',m.duration)}${line('Classes',x.cl.join(', '))}<hr>${para(m.desc)}${m.higher_level&&m.higher_level.length?`<p><b><i>At higher levels.</i></b> ${esc([].concat(m.higher_level).join(' '))}</p>`:''}</div>`};
/* ---------- generic browser (bestiary + spells): search, filter, sort, flip ---------- */
function browser(el,cfg){
 const f={q:'',full:0,sort:cfg.sorts[0][0],fl:{},i:0,pg:1};let res=[];
 el.innerHTML=`<div class="bh"><input class="q" placeholder="${cfg.ph}" autocomplete="off" spellcheck="false"><label><input type="checkbox" class="full"> Search full text</label><select class="so">${cfg.sorts.map(s=>`<option value="${s[0]}">Sort: ${s[1]}</option>`).join('')}</select><b class="cnt"></b></div><div class="fls"></div><div class="split"><div class="list"></div><div class="det"></div></div>`;
 const q=$('.q',el),fu=$('.full',el),so=$('.so',el),fl=$('.fls',el),li=$('.list',el),de=$('.det',el),cn=$('.cnt',el);
 const show=()=>{const x=res[f.i];de.innerHTML=x?`<div class="nav2"><button data-d="-1">‹ Prev</button><button data-d="1">Next ›</button>${cfg.acts}</div>`+cfg.detail(x):'<p class="mu">No matches.</p>';de.scrollTop=0;$$('.it',li).forEach((n,i)=>n.classList.toggle('on',i==f.i));$('.on',li)?.scrollIntoView({block:'nearest'})};
 const draw=()=>{cn.textContent=res.length+' found';li.innerHTML=res.slice(0,f.pg*100).map((x,i)=>`<div class="it${i==f.i?' on':''}" data-i="${i}">${cfg.row(x)}</div>`).join('')+(res.length>f.pg*100?'<button class="more" style="width:100%">Show more</button>':'');show()};
 const run=()=>{const t=f.q.toLowerCase().trim();res=cfg.ix().filter(x=>cfg.fl.every(d=>!f.fl[d.id]||d.test(x,f.fl[d.id]))&&(!t||x.L.includes(t)||(f.full&&(x.blob??=JSON.stringify(x.m).toLowerCase()).includes(t))));
  const c=cfg.sorts.find(s=>s[0]==f.sort)[2];res.sort((a,b)=>c(a,b)||a.L.localeCompare(b.L));if(t)res.sort((a,b)=>b.L.startsWith(t)-a.L.startsWith(t));f.i=0;f.pg=1;draw()};
 const go=d=>{f.i=Math.max(0,Math.min(res.length-1,f.i+d));if(f.i>=f.pg*100){f.pg++;draw()}else show()};
 el.refresh=()=>{const ix=cfg.ix();fl.innerHTML=cfg.fl.map(d=>`<select data-f="${d.id}"><option value="">${d.label}</option>${d.vals(ix).map(o=>`<option value="${esc(o)}"${f.fl[d.id]==o?' selected':''}>${esc(d.fmt?d.fmt(o):o)}</option>`).join('')}</select>`).join('');run()};
 q.oninput=()=>{f.q=q.value;run()};fu.onchange=()=>{f.full=fu.checked;run()};so.onchange=()=>{f.sort=so.value;run()};fl.onchange=e=>{f.fl[e.target.dataset.f]=e.target.value;run()};
 li.onclick=e=>{const it=e.target.closest('.it');if(it){f.i=+it.dataset.i;show()}else if(e.target.closest('.more')){f.pg++;draw()}};
 de.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.d)go(+b.dataset.d);else if(b.dataset.act&&res[f.i])cfg.on(b.dataset.act,res[f.i])};
 el.tabIndex=0;el.onkeydown=e=>{if(e.target.matches('input,select'))return;if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)};return el}
const uniq=(ix,k)=>[...new Set(ix.map(x=>x[k]).filter(Boolean))].sort();
const spd=['fly','swim','burrow','climb'],dmg=['acid','cold','fire','force','lightning','necrotic','poison','psychic','radiant','thunder'];
const BM=browser($('#bm'),{ph:'Search monsters by name…',ix:()=>IX.mon,
 sorts:[['name','Name',()=>0],['cr','CR ↑',(a,b)=>a.cr-b.cr],['crd','CR ↓',(a,b)=>b.cr-a.cr],['hp','HP ↓',(a,b)=>b.hp-a.hp],['ac','AC ↓',(a,b)=>b.ac-a.ac]],
 fl:[{id:'crmin',label:'CR from',vals:ix=>[...new Set(ix.map(x=>x.cr).filter(c=>c>=0))].sort((a,b)=>a-b),fmt:crS,test:(x,v)=>x.cr>=+v},
  {id:'crmax',label:'CR to',vals:ix=>[...new Set(ix.map(x=>x.cr).filter(c=>c>=0))].sort((a,b)=>a-b),fmt:crS,test:(x,v)=>x.cr>=0&&x.cr<=+v},
  {id:'type',label:'Type',vals:ix=>uniq(ix,'type'),test:(x,v)=>x.type==v},{id:'size',label:'Size',vals:ix=>uniq(ix,'size'),test:(x,v)=>x.size==v},{id:'src',label:'Source',vals:ix=>uniq(ix,'src'),test:(x,v)=>x.src==v},
  {id:'leg',label:'Legendary',vals:()=>['yes'],test:x=>x.m.legendary_actions?.length},
  {id:'mv',label:'Movement',vals:()=>spd,test:(x,v)=>JSON.stringify(x.m.speed||'').toLowerCase().includes(v)},
  {id:'dmg',label:'Resist/Immune',vals:()=>dmg,test:(x,v)=>((x.m.damage_resistances||'')+(x.m.damage_immunities||'')).toString().toLowerCase().includes(v)}],
 row:x=>`${esc(x.name)}<small>${x.src} · CR ${crS(x.cr)} · ${x.type||'—'} · AC ${x.ac} · HP ${x.hp}</small>`,detail:x=>sb(x.m),
 acts:'<button class="pri" data-act="add">+ Add to encounter</button><button data-act="clone">Clone to homebrew</button>',
 on:(a,x)=>{if(a=='add'){addMon(x.m);toast(x.name+' added')}else{hbForm({...x.m,name:x.name+' (copy)',slug:'',document__slug:'homebrew'});tab('hb')}}});
const BS=browser($('#bs'),{ph:'Search spells by name…',ix:()=>IX.spell,
 sorts:[['name','Name',()=>0],['lv','Level ↑',(a,b)=>a.lv-b.lv],['lvd','Level ↓',(a,b)=>b.lv-a.lv]],
 fl:[{id:'lv',label:'Level',vals:ix=>[...new Set(ix.map(x=>x.lv))].sort((a,b)=>a-b),fmt:v=>v==0?'Cantrip':v,test:(x,v)=>x.lv==v},{id:'sch',label:'School',vals:ix=>uniq(ix,'sch'),test:(x,v)=>x.sch==v},
  {id:'cl',label:'Class',vals:ix=>[...new Set(ix.flatMap(x=>x.cl))].sort(),test:(x,v)=>x.cl.includes(v)},{id:'rit',label:'Ritual',vals:()=>['yes'],test:x=>x.rit},{id:'con',label:'Concentration',vals:()=>['yes'],test:x=>x.con}],
 row:x=>`${esc(x.name)}<small>${x.lv?'Level '+x.lv:'Cantrip'} · ${esc(x.sch)}${x.con?' · Conc.':''}${x.rit?' · Ritual':''}</small>`,detail:spellCard,acts:'',on:()=>{}});
/* ---------- tracker ---------- */
const COND=[['conc','🧠','Concentrating'],['prone','⬇️','Prone'],['poison','🤢','Poisoned'],['restrain','🕸️','Restrained'],['stun','💫','Stunned'],['blind','🙈','Blinded'],['charm','💘','Charmed'],['fear','😱','Frightened'],['para','🧊','Paralyzed'],['invis','👻','Invisible']];
const pct=c=>c.maxHp?Math.max(0,Math.min(100,c.hp/c.maxHp*100)):0,col=p=>p<=25?'var(--red)':p<=50?'var(--br)':'var(--grn)';
function pcSheet(c){const s=c.sc||{};return `<div class="sb"><h3>${esc(c.name)}</h3><div class="sub">Player character</div><hr><div class="ab">${AB.map(([a])=>{const v=s[a]??10;return `<div><b>${a.toUpperCase()}</b>${v}<small>${mod(v)}</small></div>`}).join('')}</div><hr>${line('Passive Perception',c.pp??10)}${line('Passive Insight',c.pi??10)}${line('Passive Investigation',c.pv??10)}${c.sdc!==''&&c.sdc!=null?line('Spell Save DC',c.sdc):''}</div>`}
const row=(c,i)=>{const p=pct(c),L=c.type=='lair';return`<div class="cb ${c.type}${i==S.active?' act':''}${!L&&c.hp<=0?' dead':''}" data-id="${c.id}"><div class="r1"><label>${c.type}<input class="nm" data-f="name" value="${esc(c.name)}"></label>
${L?'':`<label>AC<input type="number" data-f="ac" value="${c.ac}"></label><label>HP /${c.maxHp}<input type="number" class="hp" data-f="hp" value="${c.hp}"></label><label>± HP<input class="calc" data-calc="hp" placeholder="-7 ↵"></label><label>Bonus<input type="number" data-f="initBonus" value="${c.initBonus}"></label><label>Roll<input class="calc" data-calc="init" placeholder="d20 ↵" inputmode="numeric"></label>`}
<label>Init<input type="number" data-f="initTotal" value="${c.initTotal}"></label>${c.type=='player'?'<button data-a="party" title="Add to party">👥 Party</button>':''}<button data-a="dup" title="Duplicate">⧉</button><button class="dg" data-a="rm">✕</button></div>
${L?'':`<div class="bar"><i style="width:${p}%;background:${col(p)}"></i></div>`}
<div class="r2"><div class="cons">${COND.map(([k,e,t])=>`<button class="cd${c.st?.[k]?' on':''}" data-a="st" data-k="${k}" title="${t}">${e}</button>`).join('')}</div><textarea data-f="notes" placeholder="Notes…">${esc(c.notes)}</textarea>${(c.statBlock||c.type=='player')?`<button data-a="sb">${c.open?'Hide':'Show'} ${c.type=='player'?'character sheet':'stat block'}</button>`:''}</div>${c.open&&c.statBlock?sb(c.statBlock):''}${c.open&&c.type=='player'?pcSheet(c):''}</div>`};
function render(){$('#round').textContent=S.round;$('#list').innerHTML=S.board.map(row).join('')||'<p class="mu">Board is empty. Add a monster, a player, or load a saved encounter.</p>';save()}
const sv=(i,v)=>{if(i&&document.activeElement!==i)i.value=v};
function upd(r,c){const p=pct(c),b=$('.bar i',r);sv($('.hp',r),c.hp);sv($('[data-f=initTotal]',r),c.initTotal);if(b){b.style.width=p+'%';b.style.background=col(p)}r.classList.toggle('dead',c.type!='lair'&&c.hp<=0)}
function nn(base){const re=new RegExp('^'+base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?: (\\d+))?$','i'),m=S.board.filter(c=>re.test(c.name));if(!m.length)return base;let mx=0;m.forEach(c=>{const g=c.name.match(re)[1];if(g)mx=Math.max(mx,+g);else{c.name=base+' 1';mx=Math.max(mx,1)}});return base+' '+(mx+1)}
const addMon=m=>{const n=nm(m);S.board.push({id:uid(),type:'monster',name:nn(n.name),ac:n.ac,hp:n.hp,maxHp:n.hp,initBonus:Math.floor((sc(m,'dex','dexterity')-10)/2),initRoll:'',initTotal:0,notes:'',st:{},ref:n.slug,statBlock:m});render()};
const roll=f=>{const m=String(f||'').toLowerCase().replace(/\s/g,'').match(/^(\d+)d(\d+)([+-]\d+)?$/);if(!m)return null;let t=+(m[3]||0);for(let i=0;i<+m[1];i++)t+=1+Math.floor(Math.random()*+m[2]);return Math.max(1,t)};
const hydrate=b=>b.forEach(c=>{if(c.ref)c.statBlock=BY.get(c.ref)?.m});
const L=$('#list'),cOf=e=>{const r=e.target.closest('.cb');return[S.board.find(c=>c.id==r?.dataset.id),r]};
L.addEventListener('input',e=>{const f=e.target.dataset.f,[c,r]=cOf(e);if(!f||!c)return;c[f]=e.target.type=='number'?(parseInt(e.target.value)||0):e.target.value;upd(r,c);save()});
L.addEventListener('keydown',e=>{const k=e.target.dataset.calc;if(!k||e.key!='Enter')return;const[c,r]=cOf(e),v=parseInt(e.target.value);if(isNaN(v))return;if(k=='hp')c.hp+=v;else{c.initRoll=v;c.initTotal=v+(+c.initBonus||0)}e.target.value='';upd(r,c);save()});
L.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const[c]=cOf(e),i=S.board.indexOf(c),a=b.dataset.a;
 if(a=='rm'){S.board.splice(i,1);if(S.active>=i&&S.active>0)S.active--}
 else if(a=='dup'){const{statBlock,...rest}=c,n=JSON.parse(JSON.stringify(rest));n.id=uid();n.initTotal=0;n.initRoll='';n.name=nn(c.name.replace(/ \d+$/,''));n.statBlock=statBlock;S.board.splice(i+1,0,n);if(i<S.active)S.active++}
 else if(a=='st'){c.st=c.st||{};c.st[b.dataset.k]=!c.st[b.dataset.k]}else if(a=='sb')c.open=!c.open;else if(a=='party')return G.addToParty(c);render()});
/* monster picker — selects only on a real tap, never on a scroll-drag */
const pq=$('#pq'),pl=$('#pl');let pick=null,pd=null;
function pkDraw(){const q=pq.value.toLowerCase().trim();let r=IX.mon.filter(x=>!q||x.L.includes(q));r.sort((a,b)=>b.L.startsWith(q)-a.L.startsWith(q));pl.innerHTML=r.slice(0,60).map(x=>`<div class="pi" data-s="${esc(x.slug)}">${esc(x.name)}<small>${x.src} · CR ${crS(x.cr)} · AC ${x.ac} · HP ${x.hp}</small></div>`).join('');pl.hidden=!r.length}
pq.oninput=()=>{pick=null;pkDraw()};pq.onfocus=pkDraw;
pq.onkeydown=e=>{if(e.key=='Enter')addPicked()};
pl.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY}});
pl.addEventListener('pointercancel',()=>pd=null);
pl.addEventListener('pointerup',e=>{const it=e.target.closest('.pi');if(!pd||!it)return;const moved=Math.hypot(e.clientX-pd.x,e.clientY-pd.y);pd=null;if(moved<8){pick=it.dataset.s;pq.value=BY.get(pick).name;pl.hidden=true}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.picker'))pl.hidden=true});
function addPicked(){const t=pq.value.trim().toLowerCase(),x=BY.get(pick)||IX.mon.find(x=>x.L==t)||IX.mon.find(x=>x.L.includes(t));if(!t||!x)return toast('Monster not found');addMon(x.m);pq.value='';pick=null;pl.hidden=true}
/* parties */
const parties=async()=>(await get('parties'))||{};
const mkPlayer=d=>{const v=x=>+x||10;return{id:uid(),type:'player',name:d.name.trim(),ac:+d.ac||10,hp:+d.hp||1,maxHp:+d.hp||1,initBonus:+d.ib||0,initRoll:'',initTotal:0,notes:'',st:{},sc:d.sc||{str:v(d.str),dex:v(d.dex),con:v(d.con),int:v(d.int),wis:v(d.wis),cha:v(d.cha)},pp:v(d.pp),pi:v(d.pi),pv:v(d.pv),sdc:d.sdc||''}};
async function toParty(c,name){const P=await parties();P[name]=(P[name]||[]).filter(x=>x.name!=c.name).concat({name:c.name,ac:c.ac,maxHp:c.maxHp,initBonus:c.initBonus,sc:c.sc,pp:c.pp,pi:c.pi,pv:c.pv,sdc:c.sdc});await set('parties',P);toast(`${c.name} saved to ${name}`)}
/* saved encounters */
const encs=async()=>(await get('enc'))||{};
async function encDraw(){$('#es').innerHTML='<option value="">Saved encounters…</option>'+Object.keys(await encs()).map(k=>`<option>${esc(k)}</option>`).join('')}
const G={
 next(){const n=S.board.length;if(!n)return;for(let k=0;k<n;k++){S.active++;if(S.active>=n){S.active=0;S.round++}const c=S.board[S.active];if(!(c.type=='monster'&&c.hp<=0))break}render()},
 init(){S.board.forEach(c=>{if(c.type=='monster'){c.initRoll=1+Math.floor(Math.random()*20);c.initTotal=c.initRoll+(+c.initBonus||0)}});render()},
 hp(){let n=0;S.board.forEach(c=>{const h=roll(c.statBlock?.hit_dice);if(c.type=='monster'&&h){c.hp=c.maxHp=h;n++}});toast(n?`Rolled HP for ${n}`:'No hit dice found');render()},
 sort(){S.board.sort((a,b)=>b.initTotal-a.initTotal||b.initBonus-a.initBonus);S.active=S.board.length?0:-1;render()},
 md(){let m=`## Combat Encounter (Round ${S.round})\n\n| Init | Name | HP | AC | Notes |\n| :--- | :--- | :--- | :--- | :--- |\n`;S.board.forEach(c=>m+=`| ${c.initTotal} | ${c.name} | ${c.type=='lair'?'-':c.hp+'/'+c.maxHp} | ${c.type=='lair'?'-':c.ac} | ${(c.notes||'').replace(/\n/g,' ')} |\n`);copy(m,'Encounter copied')},
 addm:addPicked,
 async player(){const d=await ask('New player',[{k:'name',label:'Name'},{k:'ac',label:'AC',type:'number',value:14},{k:'hp',label:'Max HP',type:'number',value:20},{k:'ib',label:'Initiative bonus',type:'number',value:0},...['str','dex','con','int','wis','cha'].map(k=>({k,label:k.toUpperCase(),type:'number',value:10})),{k:'pp',label:'Passive Perception',type:'number',value:10},{k:'pi',label:'Passive Insight',type:'number',value:10},{k:'pv',label:'Passive Investigation',type:'number',value:10},{k:'sdc',label:'Spell save DC (blank if none)',value:''},{k:'party',label:'Also save to party (optional)',list:Object.keys(await parties())}],'Add player');if(!d||!d.name.trim())return;const p=mkPlayer(d);S.board.push(p);if(d.party.trim())await toParty(p,d.party.trim());render()},
 async addToParty(c){const P=await parties(),d=await ask('Add '+c.name+' to a party',[{k:'party',label:'Party name',list:Object.keys(P)}],'Add');if(d&&d.party.trim())toParty(c,d.party.trim())},
 async party(){const P=await parties(),n=Object.keys(P);if(!n.length)return toast('No parties yet. Use + Player, then 👥 Party on a player.');const d=await ask('Party',[{k:'party',label:'Party',type:'select',opts:n.map(k=>[k,`${k} (${P[k].length})`])},{k:'act',label:'Action',type:'select',opts:[['add','Add to board'],['del','Delete party']]}],'Go');if(!d)return;if(d.act=='del'){if(await ask('Delete party "'+d.party+'"?',[],'Delete')){delete P[d.party];await set('parties',P)}return}P[d.party].forEach(m=>S.board.push(mkPlayer({...m,hp:m.maxHp,ib:m.initBonus})));render()},
 async custom(){const d=await ask('Custom monster',[{k:'name',label:'Name',value:'Custom Monster'},{k:'ac',label:'AC',type:'number',value:10},{k:'hp',label:'HP',type:'number',value:15},{k:'ib',label:'Initiative bonus',type:'number',value:0}],'Add monster');if(!d||!d.name.trim())return;const h=+d.hp||1;S.board.push({id:uid(),type:'monster',name:nn(d.name.trim()),ac:+d.ac||10,hp:h,maxHp:h,initBonus:+d.ib||0,initRoll:'',initTotal:0,notes:'',st:{}});render()},
 lair(){S.board.push({id:uid(),type:'lair',name:'Lair Action',initTotal:20,initBonus:0,initRoll:'',notes:'',st:{}});render()},
 async esave(){if(!S.board.length)return toast('Board is empty');const d=await ask('Save encounter',[{k:'n',label:'Encounter name'}],'Save');if(!d||!d.n.trim())return;const n=d.n.trim();const e=await encs();e[n]=strip(S.board);await set('enc',e);encDraw();toast('Saved '+n)},
 async eload(){const k=$('#es').value;if(!k)return;const l=(await encs())[k]||[];l.forEach(c=>S.board.push({...c,id:uid()}));hydrate(S.board);render()},
 async edel(){const k=$('#es').value;if(!k||!(await ask('Delete encounter "'+k+'"?',[],'Delete')))return;const e=await encs();delete e[k];await set('enc',e);encDraw()}};
$('#t-track').addEventListener('click',e=>{const g=e.target.closest('[data-g]');if(g)G[g.dataset.g]()});
/* ---------- homebrew ---------- */
const HF=[['name','Name'],['size','Size'],['type','Type'],['alignment','Alignment'],['armor_class','AC','n'],['armor_desc','Armor'],['hit_points','HP','n'],['hit_dice','Hit dice'],['speed','Speed'],['challenge_rating','CR'],...AB.map(([a,f])=>[f,a.toUpperCase(),'n']),['skills','Skills'],['damage_vulnerabilities','Vulnerabilities'],['damage_resistances','Resistances'],['damage_immunities','Damage immunities'],['condition_immunities','Condition immunities'],['senses','Senses'],['languages','Languages']];
const HT=[['special_abilities','Traits'],['actions','Actions'],['bonus_actions','Bonus actions'],['reactions','Reactions'],['legendary_actions','Legendary actions']];
const flat=v=>v&&typeof v=='object'&&!Array.isArray(v)?Object.entries(v).map(([a,b])=>a+' '+b).join(', '):v??'';
const toTxt=v=>Array.isArray(v)?v.map(a=>a.name+'. '+a.desc).join('\n'):v||'';
const parse=t=>t.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.search(/[.:]\s/);return i<0?{name:l,desc:''}:{name:l.slice(0,i),desc:l.slice(i+1).trim()}});
function hbForm(m={}){const f=$('#hbf');f.dataset.slug=m.slug||'';f.innerHTML=HF.map(([k,l,t])=>`<label>${l}<input data-k="${k}"${t?' type="number"':''} value="${esc(flat(m[k]))}"></label>`).join('')+HT.map(([k,l])=>`<label class="w">${l} <small>one per line: Name. Description</small><textarea data-k="${k}" rows="3">${esc(toTxt(m[k]))}</textarea></label>`).join('')+'<div class="w tools"><button class="pri" data-a="hbsave">Save monster</button><button data-a="hbclear">New blank</button></div>'}
const hbDraw=()=>$('#hbl').innerHTML=raw.hb.map(m=>`<div class="it" style="display:flex;gap:8px;align-items:center">${esc(m.name)} <small style="flex:1">CR ${m.challenge_rating??'?'}</small><button data-a="hbedit" data-s="${esc(m.slug)}">Edit</button><button class="dg" data-a="hbdel" data-s="${esc(m.slug)}">✕</button></div>`).join('')||'<p class="mu">No homebrew monsters yet. Fill in the editor below, or clone one from the Bestiary.</p>';
$('#t-hb').addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,s=b.dataset.s;
 if(a=='hbedit')hbForm(raw.hb.find(m=>m.slug==s));else if(a=='hbclear')hbForm();
 else if(a=='hbdel'){if(await ask('Delete this monster?',[],'Delete')){raw.hb=raw.hb.filter(m=>m.slug!=s);await set('hb',raw.hb);reindex();BM.refresh();hbDraw()}}
 else if(a=='hbsave'){const o={};$$('#hbf [data-k]').forEach(i=>{const k=i.dataset.k,v=i.value.trim();if(HT.some(h=>h[0]==k)){if(v)o[k]=parse(v)}else if(v!==''){o[k]=i.type=='number'?+v:v}});
  if(!o.name)return toast('Name is required');o.slug=$('#hbf').dataset.slug||'hb-'+o.name.toLowerCase().replace(/\W+/g,'-');o.document__slug='homebrew';o.document__title='Homebrew';
  raw.hb=raw.hb.filter(m=>m.slug!=o.slug).concat(o);await set('hb',raw.hb);reindex();BM.refresh();hbDraw();hbForm();toast('Saved '+o.name)}
 else if(a=='hbcp')copy(raw.hb.map(m=>JSON.stringify(m,null,2)).join(',\n'),'Entries copied');
 else if(a=='hbdl'){if(window.top!==window)return copy(JSON.stringify(raw.hb,null,2),'JSON copied');const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(raw.hb,null,2)],{type:'application/json'}));l.download='homebrew-monsters.json';l.click()}});
/* ---------- loot ---------- */
const LT=typeof lootTables!='undefined'?lootTables:{missing:['loot-tables.js not found next to index.html']};
const LN={pocket:'Pocket Trash',salvage:'Salvage',minor:'Minor Cache',major:'Major Hoard'};let loot=[];
$('#lb').innerHTML=Object.keys(LT).map(k=>`<button class="pri" data-r="${k}">Roll ${LN[k]||k}</button>`).join('');
const lootDraw=()=>$('#ld').innerHTML=loot.length?loot.map((x,i)=>`<div class="lt"><span>${esc(x)}</span><button data-x="${i}">✕</button></div>`).join(''):'<p class="mu">Roll a table to stage loot here.</p>';
$('#t-loot').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.r){const t=LT[d.r];loot.push(t[Math.floor(Math.random()*t.length)])}else if(d.x)loot.splice(+d.x,1);else if(d.l=='clear')loot=[];
 else if(d.l=='copy'){if(!loot.length)return toast('Roll some loot first');let m=`> [!info] Loot Cache\n> [type:: loot]\n> [date:: ${new Date().toISOString().slice(0,10)}]\n>\n`+loot.map(x=>`> - [ ] ${x}\n`).join('');copy(m,'Copied for Obsidian')}lootDraw()});
/* ---------- tabs, imports, startup ---------- */
const tab=t=>{$$('.tab').forEach(s=>s.classList.toggle('on',s.id=='t-'+t));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t))};
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)tab(b.dataset.t)};
const refreshAll=()=>{BM.refresh();BS.refresh();hbDraw();hbForm();encDraw();lootDraw()};
document.addEventListener('change',async e=>{const k=e.target.dataset?.imp,f=e.target.files?.[0];if(!k||!f)return;
 try{const txt=(await f.text()).trim();if(txt[0]=='<')return toast('That is a web page, not raw JSON');const list=arr(JSON.parse(txt));
  const hb=k=='mon'?list.filter(x=>x.document__slug=='homebrew'):[],rest=k=='mon'?list.filter(x=>x.document__slug!='homebrew'):list;
  const n=merge(k,rest);raw.hb=(()=>{const m=new Map(raw.hb.map(x=>[key(x),x]));hb.forEach(x=>m.set(key(x),x));return[...m.values()]})();
  await set(k,raw[k]);await set('hb',raw.hb);reindex();refreshAll();toast(`Added ${n+hb.length} new entries`)}catch(err){toast('Import failed: '+err.message)}e.target.value=''});
async function auto(k,url){try{const r=await fetch(url);if(!r.ok)return;merge(k,arr(await r.json()));await set(k,raw[k])}catch{}}
(async()=>{try{const b=await get('board');if(b&&b.board)S=b;raw.mon=(await get('mon'))||[];raw.spell=(await get('spell'))||[];raw.hb=(await get('hb'))||[]}catch{}
 if(!raw.mon.length)await auto('mon','all-monsters.json');if(!raw.spell.length)for(const f of['srd-5.2-spells.json','all-spells.json']){if(raw.spell.length)break;await auto('spell',f)}
 reindex();hydrate(S.board);render();refreshAll()})();
