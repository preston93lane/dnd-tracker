<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encounter & Loot Tracker</title>
    <style>
        :root {
            --bg: #1e1e24; --panel: #2b2b36; --text: #f8f8f2; 
            --accent: #ffb86c; --highlight: #44475a; --danger: #ff5555;
            --success: #50fa7b; --border: #6272a4; --loot: #bd93f9;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 20px;
        }
        button {
            background-color: var(--highlight); color: var(--text);
            border: 1px solid var(--border); padding: 8px 12px;
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        button:hover { background-color: var(--border); }
        .btn-accent { background-color: var(--accent); color: #000; }
        .btn-accent:hover { background-color: #ff9933; }
        .btn-loot { background-color: var(--loot); color: #000; }
        .btn-loot:hover { background-color: #d6b3ff; }
        input, select, textarea {
            background-color: #19191e; color: var(--text);
            border: 1px solid var(--border); padding: 6px;
            border-radius: 4px; font-size: 14px;
        }
        .header-controls {
            display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
            align-items: center; justify-content: space-between;
        }
        .section-divider {
            border-top: 2px solid var(--border); margin: 30px 0 20px 0; padding-top: 20px;
        }
        .round-counter { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        .combatant-row {
            background-color: var(--panel); border: 1px solid var(--border);
            border-radius: 6px; margin-bottom: 10px; padding: 10px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .combatant-row.active { box-shadow: 0 0 10px 2px var(--success); border-color: var(--success); }
        .combatant-main {
            display: grid; grid-template-columns: 3fr 0.5fr 0.8fr 0.8fr 0.8fr 0.8fr 0.8fr auto;
            gap: 10px; align-items: center;
        }
        .lair-main { grid-template-columns: 4fr 1fr 1fr auto; }
        .status-toggles { display: flex; gap: 5px; flex-wrap: wrap; }
        .status-btn {
            background: none; border: 1px solid var(--border); font-size: 16px;
            cursor: pointer; border-radius: 4px; padding: 4px; opacity: 0.5;
        }
        .status-btn.active { opacity: 1; background-color: var(--highlight); border-color: var(--accent); }
        .notes-field { width: 100%; box-sizing: border-box; resize: vertical; min-height: 40px; }
        .loot-display {
            background-color: var(--panel); padding: 15px; border-radius: 6px; 
            border: 1px solid var(--border); min-height: 40px; line-height: 1.6;
        }
        .calc-input { border: 1px solid var(--accent); background-color: #2a2a35; }
        .calc-input::placeholder { color: #888; }
    </style>
</head>
<body>

    <div class="header-controls">
        <div>
    <button onclick="addCombatant('player')">+ Add Player</button>
    <button onclick="addCombatant('lair')">+ Add Lair/Event</button>
    
    <!-- Searchable Monster Dropdown -->
    <input list="monsterDatalist" id="monsterSearch" placeholder="Search Monster SRD..." style="width: 180px;">
    <datalist id="monsterDatalist"></datalist>
    <button onclick="addSelectedMonster()">+ Add Monster</button>
    
    <!-- Local JSON Importer -->
    <label for="jsonUpload" class="btn" style="padding: 6px 10px; background: var(--highlight); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-size: 13px;">
        📁 Import Monster JSON
    </label>
    <input type="file" id="jsonUpload" accept=".json" onchange="importMonsterJson(event)" style="display: none;">
</div>

<!-- ENCOUNTER BUILDER SECTION -->
    <div class="header-controls" style="background: var(--panel); padding: 10px; border-radius: 6px; border: 1px solid var(--border);">
        <div>
            <strong style="color: var(--accent); margin-right: 10px;">Encounter Builder:</strong>
            <button onclick="saveEncounter()" style="background: #3e3e4a;">💾 Save Current Board</button>
        </div>
        <div>
            <select id="encounterSelect">
                <option value="">-- Load Saved Encounter --</option>
            </select>
            <button onclick="loadEncounter()">Load</button>
            <button onclick="deleteEncounter()" style="background: var(--danger); padding: 8px;" title="Delete Selected Encounter">🗑️</button>
        </div>
    </div>

        <div>
            <select id="presetSelect">
                <option value="">-- Load Preset Party --</option>
		<option value="Eldoria">Eldoria Campaign</option>
                <option value="main">Main Group (Arpae, Willow, Friends)</option>
                <option value="family">Family Game (Nephew & Niece)</option>
            </select>
            <button onclick="loadPreset()">Load</button>
        </div>
    </div>

    <div class="header-controls">
        <div class="round-counter">Round: <span id="roundCount">1</span></div>
        <div>
            <button class="btn-accent" onclick="rollMonsters()">🎲 Roll Monster Init</button>
            <button class="btn-accent" onclick="sortInitiative()">⬇️ Sort Order</button>
            <button class="btn-accent" onclick="nextTurn()">⏭️ Next Turn</button>
            <button onclick="exportMarkdown()">📋 Export Encounter</button>
        </div>
    </div>

    <div id="trackerList"></div>

    <div class="section-divider header-controls">
        <div>
            <strong style="color: var(--loot); font-size: 1.2rem; margin-right: 15px;">Loot Generator</strong>
            <button class="btn-loot" onclick="generateLoot('pocket')">Roll Pocket Trash</button>
            <button class="btn-loot" onclick="generateLoot('salvage')">Roll Salvage</button>
            <button class="btn-loot" onclick="generateLoot('minor')">Roll Minor Cache</button>
            <button class="btn-loot" onclick="generateLoot('major')">Roll Major Hoard</button>
        </div>
        <div>
            <button onclick="clearLoot()" style="background:var(--danger)">Clear</button>
            <button onclick="exportLoot()">📋 Copy Loot to Obsidian</button>
        </div>
    </div>
    <div id="lootDisplay" class="loot-display">
        <em style="color: gray;">Roll on a table to generate loot. It will stage here before you export...</em>
    </div>

    <script>
        let combatants = [];
        let activeIndex = -1;
        let round = 1;

	let monsterDatabase = [];

// Pre-baked starter SRD monster for immediate testing
monsterDatabase.push({
    name: "Goblin",
    ac: 15, hp: 7, initBonus: 2,
    stats: "STR 8 (-1) | DEX 14 (+2) | CON 10 (+0) | INT 10 (+0) | WIS 8 (-1) | CHA 8 (-1)",
    traits: "Nimble Escape: Can take Disengage or Hide as a bonus action.",
    actions: "Scimitar: +4 to hit, 1d6+2 slashing damage.\nShortbow: +4 to hit, range 80/320, 1d6+2 piercing damage."
});

function updateMonsterDatalist() {
    const dl = document.getElementById('monsterDatalist');
    dl.innerHTML = '';
    monsterDatabase.forEach(m => {
        let opt = document.createElement('option');
        opt.value = m.name;
        dl.appendChild(opt);
    });
}

function addSelectedMonster() {
    const name = document.getElementById('monsterSearch').value;
    const mon = monsterDatabase.find(m => m.name.toLowerCase() === name.toLowerCase());
    
    if (mon) {
        let base = {
            id: generateId(),
            type: 'monster',
            name: mon.name,
            ac: mon.ac || 10,
            hp: mon.hp || 10,
            initBonus: mon.initBonus || 0,
            initRoll: '',
            initTotal: 0,
            notes: mon.notes || '',
            statBlock: mon, // Stores full stat block object
            showStatBlock: false,
            activeStatuses: {}
        };
        combatants.push(base);
        document.getElementById('monsterSearch').value = '';
        render();
    } else {
        alert("Monster not found in database. Try typing custom stats or importing a JSON file.");
    }
}

function importMonsterJson(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        let text = e.target.result.trim();
        
        if (text.startsWith("<!DOCTYPE") || text.startsWith("<html")) {
            alert("Error: You saved the GitHub webpage layout instead of raw JSON.");
            return;
        }

        try {
            let parsed = JSON.parse(text);
            let rawList = Array.isArray(parsed) ? parsed : (parsed.results || parsed.monsters || [parsed]);

            const seenNames = new Set();
            let list = rawList.filter(m => {
                let nameKey = (m.name || "").trim().toLowerCase();
                if (!nameKey || seenNames.has(nameKey)) return false;
                seenNames.add(nameKey);
                return true;
            });

            let newMonsters = list.map(m => {
                // Parse Armor Class
                let acVal = 10;
                if (typeof m.armor_class === 'number') acVal = m.armor_class;
                else if (typeof m.ac === 'number') acVal = m.ac;
                else if (Array.isArray(m.armor_class) && m.armor_class[0]) {
                    acVal = typeof m.armor_class[0] === 'object' ? (m.armor_class[0].value || 10) : m.armor_class[0];
                }

                // Parse Hit Points
                let hpVal = m.hit_points || m.hp || (m.hp && m.hp.average) || 10;

                // Parse Dexterity & Initiative Bonus
                let dex = m.dexterity || (m.stats ? m.stats[1] : 10);
                let dexMod = Math.floor((dex - 10) / 2);

                // Format Ability Scores
                let str = m.strength || 10, con = m.constitution || 10;
                let int = m.intelligence || 10, wis = m.wisdom || 10, cha = m.charisma || 10;
                let statsLine = `<strong>STR</strong> ${str} (${getModStr(str)}) &nbsp;&nbsp;&nbsp;—&nbsp;&nbsp;&nbsp; <strong>DEX</strong> ${dex} (${getModStr(dex)}) &nbsp;&nbsp;&nbsp;—&nbsp;&nbsp;&nbsp; <strong>CON</strong> ${con} (${getModStr(con)}) &nbsp;&nbsp;&nbsp;—&nbsp;&nbsp;&nbsp; <strong>INT</strong> ${int} (${getModStr(int)}) &nbsp;&nbsp;&nbsp;—&nbsp;&nbsp;&nbsp; <strong>WIS</strong> ${wis} (${getModStr(wis)}) &nbsp;&nbsp;&nbsp;—&nbsp;&nbsp;&nbsp; <strong>CHA</strong> ${cha} (${getModStr(cha)})`;

                // Unpack Actions
                let actionsText = '';
                if (Array.isArray(m.actions)) {
                    actionsText = m.actions.map(a => `${a.name}: ${a.desc}`).join('\n\n');
                } else if (typeof m.actions === 'string') {
                    actionsText = m.actions;
                }

                // Unpack Traits
                let traitsText = '';
                let traitsList = m.special_abilities || m.traits;
                if (Array.isArray(traitsList)) {
                    traitsText = traitsList.map(a => `${a.name}: ${a.desc}`).join('\n\n');
                } else if (typeof traitsList === 'string') {
                    traitsText = traitsList;
                }

                return {
                    name: m.name || "Unknown Monster",
                    ac: parseInt(acVal) || 10,
                    hp: parseInt(hpVal) || 10,
                    initBonus: m.init_modifier !== undefined ? parseInt(m.init_modifier) : dexMod,
                    stats: statsLine,
                    traits: traitsText,
                    actions: actionsText
                };
            });

            // --- MERGE INTO EXISTING DATABASE INSTEAD OF OVERWRITING ---
            let existingNames = new Set(monsterDatabase.map(m => m.name.toLowerCase()));
            let addedCount = 0;
            
            newMonsters.forEach(m => {
                let nameKey = m.name.trim().toLowerCase();
                if (!existingNames.has(nameKey)) {
                    monsterDatabase.push(m);
                    existingNames.add(nameKey);
                    addedCount++;
                }
            });

            // Save combined database to browser memory
            try {
                localStorage.setItem('dnd_monster_database', JSON.stringify(monsterDatabase));
            } catch (err) {
                console.warn("Could not save to localStorage:", err);
            }

            updateMonsterDatalist();
            alert(`Successfully added ${addedCount} new monsters! Total database size: ${monsterDatabase.length}`);
        } catch (err) {
            alert("JSON Syntax Error: " + err.message);
        }
    };
    reader.readAsText(file);
}

function getModStr(score) {
            let mod = Math.floor(((score || 10) - 10) / 2);
            return mod >= 0 ? `+${mod}` : `${mod}`;
        }

// Call on app startup
window.onload = function() {
    const savedData = localStorage.getItem('dnd_monster_database');
    if (savedData) {
        try {
            monsterDatabase = JSON.parse(savedData);
            updateMonsterDatalist();
        } catch (e) {
            console.error("Failed to load saved monster database", e);
        }
    } else {
        updateMonsterDatalist();
    }	
	updateEncounterDropdown(); 
};

        const presets = {
	    Eldoria: [
                { type: 'player', name: 'Dildo Baggyballs', ac: 15, hp: 20, initBonus: 2, initRoll: '', initTotal: 0 },
                { type: 'player', name: 'Erewhon Lassens', ac: 17, hp: 28, initBonus: 3, initRoll: '', initTotal: 0 },
		{ type: 'player', name: 'Babbo', ac: 14, hp: 20, initBonus: 1, initRoll: '', initTotal: 0 },
            ],
            main: [
                { type: 'player', name: 'Arpae Evans (Forest Gnome Wizard)', ac: 13, hp: 30, initBonus: 2, initRoll: '', initTotal: 0 },
                { type: 'player', name: 'Willow (Halfling)', ac: 15, hp: 35, initBonus: 3, initRoll: '', initTotal: 0 },
                { type: 'player', name: 'Carolyn', ac: 14, hp: 40, initBonus: 2, initRoll: '', initTotal: 0 },
                { type: 'player', name: 'Sloane', ac: 16, hp: 45, initBonus: 1, initRoll: '', initTotal: 0 },
                { type: 'player', name: 'Nathan', ac: 17, hp: 50, initBonus: 0, initRoll: '', initTotal: 0 },
                { type: 'player', name: 'John', ac: 18, hp: 55, initBonus: -1, initRoll: '', initTotal: 0 },
                { type: 'player', name: 'Tyler', ac: 15, hp: 40, initBonus: 2, initRoll: '', initTotal: 0 },
                { type: 'player', name: 'Aaron', ac: 14, hp: 38, initBonus: 4, initRoll: '', initTotal: 0 }
            ],
            family: [
                { type: 'player', name: 'Nephew (Hill Dwarf Cleric)', ac: 18, hp: 45, initBonus: -1, initRoll: '', initTotal: 0 },
                { type: 'player', name: 'Niece (High Elf Wizard)', ac: 12, hp: 28, initBonus: 2, initRoll: '', initTotal: 0 }
            ]
        };

        const statuses = [
            { id: 'conc', icon: '🧠', title: 'Concentration' },
            { id: 'prone', icon: '⬇️', title: 'Prone' },
            { id: 'poison', icon: '🤢', title: 'Poisoned' },
            { id: 'restrain', icon: '🕸️', title: 'Restrained' }
        ];

        function generateId() { return Math.random().toString(36).substr(2, 9); }

	// --- ENCOUNTER BUILDER LOGIC ---
        function saveEncounter() {
            if (combatants.length === 0) {
                alert("The board is empty! Add some players, monsters, or lair actions first.");
                return;
            }
            let encName = prompt("Enter a name for this encounter (e.g., 'Red Dragon Lair'):");
            if (!encName) return;

            let savedEncounters = JSON.parse(localStorage.getItem('dnd_saved_encounters') || '{}');
            // Creates a snapshot of the current combatants array
            savedEncounters[encName] = combatants; 
            localStorage.setItem('dnd_saved_encounters', JSON.stringify(savedEncounters));

            updateEncounterDropdown();
            alert(`Encounter '${encName}' saved successfully!`);
        }

        function loadEncounter() {
            const sel = document.getElementById('encounterSelect').value;
            if (!sel) return;

            let savedEncounters = JSON.parse(localStorage.getItem('dnd_saved_encounters') || '{}');
            let encToLoad = savedEncounters[sel];

            if (encToLoad) {
                // Regenerates unique IDs so you can load the same encounter twice without breaking the app
                encToLoad.forEach(c => {
                    combatants.push({ ...c, id: generateId() });
                });
                render();
            }
        }

        function deleteEncounter() {
            const sel = document.getElementById('encounterSelect').value;
            if (!sel) return;
            
            if (confirm(`Are you sure you want to delete the saved encounter: '${sel}'?`)) {
                let savedEncounters = JSON.parse(localStorage.getItem('dnd_saved_encounters') || '{}');
                delete savedEncounters[sel];
                localStorage.setItem('dnd_saved_encounters', JSON.stringify(savedEncounters));
                updateEncounterDropdown();
            }
        }

        function updateEncounterDropdown() {
            let savedEncounters = JSON.parse(localStorage.getItem('dnd_saved_encounters') || '{}');
            let select = document.getElementById('encounterSelect');
            if (!select) return;
            
            select.innerHTML = '<option value="">-- Load Saved Encounter --</option>';
            for (let encName in savedEncounters) {
                let opt = document.createElement('option');
                opt.value = encName;
                opt.innerText = encName;
                select.appendChild(opt);
            }
        }

        function addCombatant(type) {
            let base = { id: generateId(), type: type, name: '', initTotal: 0, initRoll: '', notes: '', activeStatuses: {} };
            if (type !== 'lair') {
                base.ac = 10; base.hp = 10; base.initBonus = 0;
            } else {
                base.initTotal = 20; base.name = 'Lair Action';
            }
            combatants.push(base);
            render();
        }

        function loadPreset() {
            const sel = document.getElementById('presetSelect').value;
            if (presets[sel]) {
                presets[sel].forEach(p => {
                    combatants.push({ ...p, id: generateId(), notes: '', activeStatuses: {} });
                });
                render();
            }
        }

        function rollMonsters() {
            combatants.forEach(c => {
                if (c.type === 'monster') {
                    let roll = Math.floor(Math.random() * 20) + 1;
                    c.initRoll = roll;
                    c.initTotal = roll + (parseInt(c.initBonus) || 0);
                }
            });
            render();
        }

        function sortInitiative() {
            combatants.sort((a, b) => b.initTotal - a.initTotal);
            activeIndex = combatants.length > 0 ? 0 : -1;
            render();
        }

        function nextTurn() {
            if (combatants.length === 0) return;
            activeIndex++;
            if (activeIndex >= combatants.length) {
                activeIndex = 0;
                round++;
                document.getElementById('roundCount').innerText = round;
            }
            render();
        }

        function applyHpMath(event, index, inputElem) {
            if (event.key === 'Enter') {
                event.preventDefault();
                let mod = parseInt(inputElem.value);
                if (!isNaN(mod)) {
                    let current = parseInt(combatants[index].hp) || 0;
                    combatants[index].hp = current + mod;
                    inputElem.value = '';
                    render();
                }
            }
        }

        function applyInitMath(event, index, inputElem) {
            if (event.key === 'Enter') {
                event.preventDefault();
                let roll = parseInt(inputElem.value);
                if (!isNaN(roll)) {
                    combatants[index].initRoll = roll;
                    let bonus = parseInt(combatants[index].initBonus) || 0;
                    combatants[index].initTotal = roll + bonus;
                    inputElem.value = ''; 
                    render();
                }
            }
        }

        function toggleStatus(index, statusId) {
            combatants[index].activeStatuses[statusId] = !combatants[index].activeStatuses[statusId];
            render();
        }

        function removeCombatant(index) {
            combatants.splice(index, 1);
            if (activeIndex >= index && activeIndex > 0) activeIndex--;
            render();
        }

        function exportMarkdown() {
            let md = `## Combat Encounter (Round ${round})\n\n`;
            md += `| Initiative | Name | HP | AC | Notes |\n`;
            md += `| :--- | :--- | :--- | :--- | :--- |\n`;
            combatants.forEach(c => {
                let hpAc = c.type === 'lair' ? '| - | -' : `| ${c.hp} | ${c.ac}`;
                let cNotes = c.notes.replace(/\n/g, ' ');
                md += `| ${c.initTotal} | ${c.name} ${hpAc} | ${cNotes} |\n`;
            });
            navigator.clipboard.writeText(md).then(() => alert('Encounter copied to clipboard!'));
        }

        function updateField(index, field, value) {
            combatants[index][field] = value;
        }

        function render() {
            const list = document.getElementById('trackerList');
            list.innerHTML = '';
            
            combatants.forEach((c, i) => {
                let isActive = i === activeIndex ? 'active' : '';
                let row = document.createElement('div');
                row.className = `combatant-row ${isActive}`;
                
                let mainDiv = document.createElement('div');
                mainDiv.className = c.type === 'lair' ? 'combatant-main lair-main' : 'combatant-main';
                
                let nameHtml = `<input type="text" placeholder="${c.type} name" value="${c.name}" onchange="updateField(${i}, 'name', this.value)" style="border-left: 4px solid ${c.type === 'player' ? '#50fa7b' : c.type === 'monster' ? '#ff5555' : '#ffb86c'};">`;
                
                let statsHtml = '';
                if (c.type !== 'lair') {
                    statsHtml = `
                        <div><small>AC</small><br><input type="number" value="${c.ac}" onchange="updateField(${i}, 'ac', this.value)" style="width: 45px;"></div>
                        <div><small>Cur HP</small><br><input type="number" value="${c.hp}" onchange="updateField(${i}, 'hp', this.value)" style="width: 55px;"></div>
                        <div><small>+/- HP</small><br><input type="text" placeholder="-7 ↵" class="calc-input" onkeydown="applyHpMath(event, ${i}, this)" title="Type number and hit Enter" style="width: 55px;"></div>
                        <div><small>Bonus</small><br><input type="number" value="${c.initBonus}" onchange="updateField(${i}, 'initBonus', this.value)" style="width: 50px;"></div>
                        <div><small>Roll</small><br><input type="number" placeholder="d20 ↵" class="calc-input" value="${c.initRoll}" onkeydown="applyInitMath(event, ${i}, this)" title="Type roll and hit Enter" style="width: 50px;"></div>
                    `;
                }

                let initTotalHtml = `<div><small>Total Init</small><br><input type="number" value="${c.initTotal}" onchange="updateField(${i}, 'initTotal', this.value)" style="width: 60px;"></div>`;
                
                let btnHtml = `<button onclick="removeCombatant(${i})" style="background:var(--danger)">X</button>`;
                
                mainDiv.innerHTML = nameHtml + statsHtml + initTotalHtml + btnHtml;
                row.appendChild(mainDiv);

                let subDiv = document.createElement('div');
                subDiv.style.display = 'flex'; subDiv.style.gap = '10px'; subDiv.style.marginTop = '5px';
                
                let statusDiv = document.createElement('div');
                statusDiv.className = 'status-toggles';
                statuses.forEach(st => {
                    let activeCls = c.activeStatuses[st.id] ? 'active' : '';
                    statusDiv.innerHTML += `<button class="status-btn ${activeCls}" title="${st.title}" onclick="toggleStatus(${i}, '${st.id}')">${st.icon}</button>`;
                });
                
                let notesHtml = `<textarea class="notes-field" placeholder="Mechanics, triggers, conditions..." onchange="updateField(${i}, 'notes', this.value)">${c.notes}</textarea>`;
                
                let notesContainer = document.createElement('div');
                notesContainer.style.flexGrow = '1';
                notesContainer.innerHTML = notesHtml;

                subDiv.appendChild(statusDiv);
                if (c.type !== 'lair') subDiv.appendChild(notesContainer);
                else {
                     let lairNotes = document.createElement('div');
                     lairNotes.style.flexGrow = '1';
                     lairNotes.innerHTML = `<textarea class="notes-field" placeholder="Lair Action description..." onchange="updateField(${i}, 'notes', this.value)">${c.notes}</textarea>`;
                     subDiv.appendChild(lairNotes);
                }

		if (c.type === 'monster' && c.statBlock) {
                let toggleBtn = document.createElement('button');
                toggleBtn.innerText = c.showStatBlock ? "📖 Hide Stat Block" : "📖 Show Stat Block";
                toggleBtn.style.fontSize = "11px";
                toggleBtn.onclick = function() {
                    c.showStatBlock = !c.showStatBlock;
                    render();
                };
                subDiv.appendChild(toggleBtn);

                if (c.showStatBlock) {
                    let statCard = document.createElement('div');
                    statCard.style.cssText = "background: #19191e; padding: 10px; margin-top: 5px; border-radius: 4px; border-left: 3px solid var(--danger); font-size: 12px; width: 100%;";
                    statCard.innerHTML = `

        function generateLoot(type) {
            const table = lootTables[type];
            const result = table[Math.floor(Math.random() * table.length)];
            currentLoot.push(`- [ ] ${result}`);
            renderLootDisplay();
        }

        function clearLoot() {
            currentLoot = [];
            renderLootDisplay();
        }

        function renderLootDisplay() {
            const display = document.getElementById('lootDisplay');
            if (currentLoot.length === 0) {
                display.innerHTML = '<em style="color: gray;">Roll on a table to generate loot. It will stage here before you export...</em>';
            } else {
                display.innerHTML = currentLoot.join('<br>');
            }
        }

        function exportLoot() {
            if (currentLoot.length === 0) {
                alert("Roll some loot first!");
                return;
            }
            const today = new Date().toISOString().split('T')[0];
            let md = `> [!info] Loot Cache\n> [type:: loot]\n> [date:: ${today}]\n>\n`;
            currentLoot.forEach(item => { md += `> ${item}\n`; });
            navigator.clipboard.writeText(md).then(() => {
                alert('Formatted loot copied to clipboard for Obsidian!');
            });
        }
    </script>
